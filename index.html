<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIT Clockin｜差勤打卡</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f0f2f5;margin:0;padding:18px;color:#18324b}.container{max-width:460px;margin:auto;background:#fff;padding:22px;border-radius:14px;box-shadow:0 4px 16px #0001}h2{text-align:center;margin-top:0}.info{background:#f6f8fa;padding:10px;border-radius:7px;margin:10px 0;font-size:14px;overflow-wrap:anywhere}.field{width:100%;padding:12px;border:1px solid #ccd5df;border-radius:7px;margin:6px 0 10px;font-size:16px}.btn{width:100%;padding:12px;background:#003366;color:#fff;border:0;border-radius:7px;font-weight:bold;margin:6px 0;cursor:pointer}.btn.secondary{background:#64748b}.btn:disabled{opacity:.5}.status{padding:11px;border-radius:8px;background:#edf0f2;margin:12px 0;text-align:center}.success{background:#d4edda;color:#155724}.error{background:#f8d7da;color:#721c24}.qr-wrapper{position:relative;width:220px;height:220px;margin:18px auto;padding:8px;border:2px solid #003366}.watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-25deg);color:#c33a;font-weight:bold;pointer-events:none}small{color:#5c6773}
</style>
</head>
<body><main class="container">
<h2>AIT Clockin 差勤打卡</h2>
<section id="authPanel">
<p>使用手機號碼接收簡訊驗證碼登入。</p>
<input class="field" id="phone" type="tel" placeholder="手機號碼，例如 +886912345678" autocomplete="tel">
<div id="recaptcha-container"></div>
<button class="btn" id="sendCode">傳送簡訊驗證碼</button>
<input class="field" id="smsCode" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="收到簡訊後，輸入 6 位數驗證碼" maxlength="6">
<button class="btn" id="verifyCode">驗證並登入</button>
<div class="info" id="authMessage">尚未登入</div>
</section>
<section id="clockPanel" hidden>
<div class="info">登入帳號：<span id="signedEmail"></span></div>
<div class="info">網路 IP：<span id="wifiIp">偵測中…</span></div>
<div class="info">GPS：<span id="gpsStatus">尚未讀取</span></div>
<div class="qr-wrapper"><div id="qrcode"></div><div class="watermark" id="watermarkText">AIT</div></div>
<small>QR Code 目前由頁面產生，尚未由伺服器驗證。</small>
<div class="status" id="statusBadge">請先驗證位置</div>
<button class="btn" id="checkIn">上班打卡</button>
<button class="btn" id="checkOut">下班打卡</button>
<button class="btn secondary" id="signOut">登出</button>
<div class="info" id="todayRecord">今日紀錄讀取中…</div>
</section>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
 apiKey:"AIzaSyAHUzmtQblpCAYNGLsG-2-WOslI2qOkRqs",
 authDomain:"ait-clockin.firebaseapp.com",
 projectId:"ait-clockin",
 storageBucket:"ait-clockin.firebasestorage.app",
 messagingSenderId:"486608755618",
 appId:"1:486608755618:web:a8f2c39bb508eed277b0fb",
 measurementId:"G-HTNGTGMPS2"
};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const $=id=>document.getElementById(id);
const targets=[{name:"AIT 台北辦事處",lat:25.02613,lng:121.57915,radius:200},{name:"AIT 高雄分處",lat:22.61053,lng:120.30601,radius:150}];
let currentUser=null, locationFix=null, qr, recaptchaVerifier=null, confirmationResult=null;
const dateKey=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
const localStamp=()=>new Intl.DateTimeFormat("zh-TW",{timeZone:"Asia/Taipei",dateStyle:"short",timeStyle:"medium"}).format(new Date());
function showStatus(msg,type=""){ $("statusBadge").textContent=msg; $("statusBadge").className="status "+type; }
function recordRef(){return doc(db,"attendance",currentUser.uid+"_"+dateKey());}
async function refreshRecord(){
 if(!currentUser)return;
 const snap=await getDoc(recordRef());
 if(!snap.exists()){$("todayRecord").textContent="今日尚無打卡紀錄";return;}
 const d=snap.data();
 $("todayRecord").textContent="今日紀錄｜上班："+(d.checkIn?.displayTime||"尚未打卡")+"｜下班："+(d.checkOut?.displayTime||"尚未打卡");
}
function distanceMeters(a,b){const R=6371000,rad=x=>x*Math.PI/180,dLat=rad(b.lat-a.lat),dLng=rad(b.lng-a.lng);const q=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;return 2*R*Math.atan2(Math.sqrt(q),Math.sqrt(1-q));}
function getPosition(){return new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject(Error("瀏覽器不支援定位"));navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:12000,maximumAge:0});});}
async function verifyAndSave(kind){
 if(!currentUser)return showStatus("請先登入","error");
 try{
  showStatus("正在取得 GPS…");
  const pos=await getPosition(),coords={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy};
  $("gpsStatus").textContent=coords.lat.toFixed(5)+", "+coords.lng.toFixed(5)+"（精度約 "+Math.round(coords.accuracy)+"m）";
  const match=targets.map(t=>({...t,distance:distanceMeters(coords,t)})).find(t=>t.distance<=t.radius);
  if(!match){locationFix=null;showStatus("定位不在 AIT 核准範圍內，未儲存","error");return;}
  locationFix={...coords,site:match.name,distanceMeters:Math.round(match.distance)};
  const ref=recordRef(),snap=await getDoc(ref),old=snap.exists()?snap.data():{};
  const field=kind==="in"?"checkIn":"checkOut";
  if(old[field]){showStatus((kind==="in"?"上班":"下班")+"打卡已存在，避免重複寫入","error");return;}
  if(kind==="out"&&!old.checkIn){showStatus("尚無上班紀錄，請先完成上班打卡","error");return;}
  const entry={displayTime:localStamp(),timestamp:serverTimestamp(),gps:locationFix};
  await setDoc(ref,{uid:currentUser.uid,email:currentUser.email,date:dateKey(),[field]:entry,updatedAt:serverTimestamp()},{merge:true});
  showStatus((kind==="in"?"上班":"下班")+"打卡已儲存｜"+match.name,"success");
  await refreshRecord();
 }catch(e){showStatus("打卡失敗："+(e.message||"定位或資料庫錯誤"),"error");}
}
function getRecaptcha(){
 if(!recaptchaVerifier){
  recaptchaVerifier=new RecaptchaVerifier(auth,"recaptcha-container",{size:"normal"});
 }
 return recaptchaVerifier;
}
$("sendCode").addEventListener("click",async()=>{
 const phone=$("phone").value.trim().replace(/[\\s()-]/g,"");
 if(!/^\+[1-9]\d{7,14}$/.test(phone)){
  $("authMessage").textContent="請輸入含國碼的手機號碼，例如 +886912345678";
  return;
 }
 $("sendCode").disabled=true;
 try{
  confirmationResult=await signInWithPhoneNumber(auth,phone,getRecaptcha());
  $("smsCode").focus();
  $("authMessage").textContent="驗證碼已寄出，請在下方輸入收到的 6 位數簡訊驗證碼。";
 }catch(e){
  $("authMessage").textContent="簡訊寄送失敗："+(e.message||e.code);
  if(recaptchaVerifier){recaptchaVerifier.clear();recaptchaVerifier=null;}
 }finally{$("sendCode").disabled=false;}
});
$("verifyCode").addEventListener("click",async()=>{
 const code=$("smsCode").value.trim();
 if(!confirmationResult){$("authMessage").textContent="請先取得簡訊驗證碼。";return;}
 if(!/^\\d{6}$/.test(code)){$("authMessage").textContent="請輸入 6 位數驗證碼。";return;}
 try{
  await confirmationResult.confirm(code);
  $("authMessage").textContent="手機驗證成功，登入中…";
 }catch(e){$("authMessage").textContent="驗證失敗："+(e.message||e.code);}
}
onAuthStateChanged(auth,async user=>{
 currentUser=user;$("authPanel").hidden=!!user;$("clockPanel").hidden=!user;
 if(user){$("signedEmail").textContent=user.phoneNumber||"已驗證手機";try{await refreshRecord();}catch(e){$("todayRecord").textContent="紀錄讀取失敗："+e.message;}}
});
$("checkIn").addEventListener("click",()=>verifyAndSave("in"));
$("checkOut").addEventListener("click",()=>verifyAndSave("out"));
$("signOut").addEventListener("click",()=>signOut(auth));
fetch("https://api.ipify.org?format=json").then(r=>r.json()).then(d=>$("wifiIp").textContent=d.ip).catch(()=>$("wifiIp").textContent="無法取得");
if(window.QRCode){qr=new QRCode($("qrcode"),{text:"AIT Clockin QR 尚未經伺服器驗證",width:200,height:200});}
setInterval(()=>{const stamp=new Date().toLocaleTimeString("zh-TW",{hour12:false});$("watermarkText").textContent=stamp;},10000);
</script>
</body></html>
