<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIT 差勤驗證</title>
    <!-- 引入穩定的 QR Code 產生套件 -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f0f2f5; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .qr-wrapper { position: relative; margin: 20px auto; width: 200px; height: 200px; padding: 10px; border: 2px solid #003366; background: #fff; }
        .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-30deg); font-size: 14px; color: rgba(255, 0, 0, 0.4); font-weight: bold; pointer-events: none; width: 100%; }
        .info { background: #f8f9fa; padding: 10px; border-radius: 5px; margin: 10px 0; text-align: left; font-size: 13px; }
        .status-badge { display: inline-block; padding: 10px 20px; border-radius: 20px; font-weight: bold; margin: 15px 0; background: #e0e0e0; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .btn { width: 100%; padding: 12px; background: #003366; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>AIT 差勤驗證系統</h2>
    
    <!-- 浮動動態 QR Code -->
    <div class="qr-wrapper">
        <div id="qrcode"></div>
        <div class="watermark" id="watermarkText">載入中...</div>
    </div>
    <div style="font-size: 12px; color: #666; margin-bottom: 15px;">QR Code 每 10 秒自動重整</div>

    <!-- 資訊顯示 -->
    <div class="info">🌐 Wi-Fi 外部 IP: <span id="wifiIp">偵測中...</span></div>
    <div class="info">📍 GPS 狀態: <span id="gpsStatus">尚未讀取</span></div>

    <div id="statusBadge" class="status-badge">等待驗證...</div>
    <button class="btn" onclick="verifyLocation()">立刻驗證位置</button>
    <div id="phoneResult" style="font-size: 22px; color: green; font-weight: bold; margin-top: 15px; display: none;">📲 0912-345-678</div>
</div>

<script>
    // AIT 台北與高雄的真實 GPS 座標範圍
    const TARGETS = [
        { name: "AIT 台北辦事處", lat: 25.02613, lng: 121.57915, radius: 200 },
        { name: "AIT 高雄分處", lat: 22.61053, lng: 120.30601, radius: 150 }
    ];

    let qrcodeObj;

    // 網頁載入完成後初始化
    window.onload = function() {
        qrcodeObj = new QRCode(document.getElementById("qrcode"), { width: 200, height: 200 });
        
        // 啟動每 10 秒更新動態 QR Code
        setInterval(updateQR, 10000);
        updateQR();
        
        // 抓取外部 IP
        fetch('https://ipify.org')
            .then(res => res.json())
            .then(data => { document.getElementById("wifiIp").innerText = data.ip; })
            .catch(() => { document.getElementById("wifiIp").innerText = "無法取得 IP"; });
    };

    // 更新動態防代打卡條碼
    function updateQR() {
        if (!qrcodeObj) return;
        const now = new Date();
        const timeStr = now.toLocaleTimeString('zh-TW', { hour12: false });
        const token = Math.random().toString(36).substring(2, 7).toUpperCase();
        
        qrcodeObj.makeCode("AIT_SECURE_" + now.getTime() + "_" + token);
        document.getElementById("watermarkText").innerText = timeStr + " " + token;
    }

    // 驗證定位
    function verifyLocation() {
        const badge = document.getElementById("statusBadge");
        const gpsStatus = document.getElementById("gpsStatus");
        const phone = document.getElementById("phoneResult");

        badge.innerText = "驗證中...";
        badge.className = "status-badge";
        phone.style.display = "none";

        if (!navigator.geolocation) {
            badge.innerText = "位置異常：手機不支援 GPS";
            badge.className = "status-badge error";
            return;
        }

        navigator.geolocation.getCurrentPosition((pos) => {
            const uLat = pos.coords.latitude;
            const uLng = pos.coords.longitude;
            gpsStatus.innerText = uLat.toFixed(4) + ", " + uLng.toFixed(4);

            let isMatch = false;
            for (let target of TARGETS) {
                // Haversine 公式計算距離
                const R = 6371e3;
                const dLat = (target.lat - uLat) * Math.PI / 180;
                const dLng = (target.lng - uLng) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                          Math.cos(uLat*Math.PI/180) * Math.cos(target.lat*Math.PI/180) *
                          Math.sin(dLng/2) * Math.sin(dLng/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                const distance = R * c;

                if (distance <= target.radius) {
                    isMatch = true;
                    badge.innerText = "驗證成功：" + target.name;
                    badge.className = "status-badge success";
                    phone.style.display = "block";
                    break;
                }
            }

            if (!isMatch) {
                badge.innerText = "位置異常：不在 AIT 核准範圍內";
                badge.className = "status-badge error";
            }

        }, () => {
            badge.innerText = "位置異常：GPS 讀取失敗或未授權";
            badge.className = "status-badge error";
        }, { enableHighAccuracy: true, timeout: 8000 });
    }
</script>

</body>
</html>
